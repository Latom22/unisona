# fly.toml — Unisona realtime worker
# Deploy:  fly launch --no-deploy --copy-config  (first time), then  fly deploy
app = "unisona-realtime"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "info"
  DEEPGRAM_MODEL = "nova-3"
  TRANSLATION_MODEL = "claude-opus-5-5"
  TRANSLATION_EFFORT = "low"
  AZURE_SPEECH_REGION = "eastus"
  BROADCASTER_GRACE_MS = "30000"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived WebSockets: never stop a machine that is serving a service.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[deploy]
  strategy = "rolling"
